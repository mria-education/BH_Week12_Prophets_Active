*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;font-size:var(--font);line-height:1.62}.app{width:100vw;height:100vh;display:grid;grid-template-columns:345px minmax(0,1fr);overflow:hidden}aside{height:100vh;overflow-y:auto;padding:22px 18px;background:linear-gradient(180deg,#fffaf2,#eee2d2);border-right:1px solid var(--line)}main{height:100vh;overflow-y:auto;padding:34px 44px 90px}.brand,.card,.hero{background:rgba(255,250,242,.96);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.brand{padding:18px;margin-bottom:18px}.course{font-size:.78rem;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}h1{font-size:clamp(2.05rem,4.2vw,4rem);line-height:1.03;letter-spacing:-.045em;margin:8px 0 12px}h2{font-size:clamp(1.55rem,2.6vw,2.45rem);line-height:1.12;letter-spacing:-.035em;margin:0 0 16px}h3{font-size:1.25rem;color:var(--accent2);margin:22px 0 9px}h4{font-size:1.03rem;color:var(--accent);margin:16px 0 7px}p{margin:0 0 14px}.subtitle{font-size:1.04rem;color:var(--muted);max-width:1040px}.lang-row,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.lang-row{margin-top:14px}button,select,input,textarea{font:inherit}button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--soft);color:var(--ink);font-size:.92rem}button:hover{filter:brightness(.98);box-shadow:0 8px 18px rgba(0,0,0,.08)}button.active,.primary{background:var(--accent2);color:#fff}button.secondary{background:var(--accent);color:#fff}.nav{display:grid;gap:8px;margin:14px 0}.nav button{width:100%;text-align:left;border-radius:16px;background:rgba(255,255,255,.78);border:1px solid var(--line);white-space:normal;line-height:1.35}.nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}.nav small{display:block;font-weight:600;opacity:.82}.progress-wrap{margin:18px 0}.progress-label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:7px}.progress-track{height:9px;background:#dfd2c0;border-radius:999px;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--accent2);transition:.25s}.hero{padding:28px;margin-bottom:20px}.card{padding:24px;margin-bottom:18px;background:rgba(255,255,255,.82)}.grid{display:grid;gap:18px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.pill{display:inline-flex;padding:6px 11px;border-radius:999px;background:var(--soft);color:var(--accent2);font-size:.78rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin:0 6px 8px 0}label{display:block;font-weight:900;margin:12px 0 6px}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:18px;padding:13px 14px;background:#fffdf8}textarea{min-height:135px;resize:vertical}.mini{min-height:82px}.muted{color:var(--muted)}.warning{background:var(--warn)}.success{background:var(--success)}.danger{background:var(--danger)}.blue{background:var(--blue)}.promptBox{white-space:normal;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}.promptBox p{margin:0 0 13px}.promptBox ul,.promptBox ol{margin:8px 0 14px 1.2rem;padding:0}.promptBox li{margin:4px 0}.promptBox blockquote{margin:12px 0;padding:12px 14px;border-left:5px solid var(--accent2);background:#f8fafc;border-radius:12px}.questionCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:10px 0}.questionLabel{font-weight:900;color:var(--accent2);text-transform:uppercase;letter-spacing:.04em;font-size:.8rem}.displayLine{white-space:pre-wrap;background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0 14px;color:#3b2a1c}.copyMsg{display:inline-block;margin-left:8px;color:var(--accent2);font-size:.86rem;font-weight:800}.footerNav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.table{width:100%;border-collapse:collapse;margin:15px 0;background:#fff;border-radius:16px;overflow:hidden}.table th,.table td{border:1px solid var(--line);padding:11px;vertical-align:top}.table th{background:var(--soft);text-align:left}.screen{max-width:1240px;margin:0 auto}.textCard{cursor:pointer;transition:.15s}.textCard:hover{transform:translateY(-2px)}.textCard.active{outline:3px solid var(--accent2);background:#f4fbf7}.dayHead{font-size:1.05rem;font-weight:950;color:var(--accent);margin:8px 0 0}.stageRibbon{display:inline-flex;align-items:center;gap:8px;background:#241a12;color:#fff;border-radius:999px;padding:8px 12px;font-weight:900;font-size:.82rem;margin-bottom:10px}.toast{position:fixed;right:22px;bottom:22px;background:var(--accent2);color:#fff;padding:12px 16px;border-radius:999px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;z-index:99}.toast.show{opacity:1;transform:translateY(0)}.mcq-option{display:block;width:100%;margin:8px 0;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;text-align:left;cursor:pointer}.mcq-option.correct{border-color:#2f5d50;background:#e9f2ee}.mcq-option.wrong{border-color:#9d3b31;background:#f8e8e5}details{border:1px solid var(--line);border-radius:18px;background:#fffdf8;padding:14px 16px;margin:12px 0}summary{cursor:pointer;font-weight:900;color:var(--accent2)}@media(max-width:1000px){body{overflow:auto}.app{display:block;height:auto;min-height:100vh;overflow:auto}aside{height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line)}main{height:auto;overflow:visible;padding:22px 18px 70px}.grid.two,.grid.three,.grid.four{grid-template-columns:1fr}}@media print{aside,.footerNav,.no-print,.toast{display:none!important}.app{display:block}.screen{max-width:none}main{height:auto;overflow:visible;padding:0}.card,.hero{box-shadow:none;break-inside:avoid}body{background:white}}

<script>
const DATA = {"meta": {"en": {"course": "GEK20070-01 · Week 12 · Biblical Hermeneutics", "title": "The Prophets: Covenant Enforcement and Biblical Hermeneutics", "subtitle": "Hearing the Prophets as Forth-Tellers, Covenant Mediators, and Illumined Guides", "sources": "Primary Sources: Gordon D. Fee & Douglas Stuart · Grant R. Osborne", "school": "Handong Global University · Department of Biblical Studies", "progress": "Progress", "overview": "Overview", "print": "Print / Save PDF", "export": "Export Reflection JSON", "reset": "Reset", "prev": "Previous", "next": "Next", "complete": "Complete", "showAnswer": "Show Guide", "hideAnswer": "Hide Guide", "grade": "Grade MCQ", "score": "Score", "name": "Student Name", "studentId": "Student ID", "class": "Class", "exportHint": "Use this local export for pre-class Adaptive Learning. It can later be connected to Google Sheets through Apps Script."}, "ko": {"course": "GEK20070-01 · 12주차 · 성경해석학", "title": "예언서: 언약 집행과 성경해석학", "subtitle": "예언자를 미래 예언가가 아니라 하나님의 말씀을 전하는 언약 중재자와 조명 받은 안내자로 듣기", "sources": "주요 자료: Gordon D. Fee & Douglas Stuart · Grant R. Osborne", "school": "한동대학교 · 성경학/성경해석학", "progress": "진행률", "overview": "개요", "print": "인쇄 / PDF 저장", "export": "성찰 JSON 내보내기", "reset": "초기화", "prev": "이전", "next": "다음", "complete": "완료", "showAnswer": "가이드 보기", "hideAnswer": "가이드 숨기기", "grade": "선다형 채점", "score": "점수", "name": "학생 이름", "studentId": "학번", "class": "분반", "exportHint": "이 로컬 내보내기는 수업 전 Adaptive Learning 기록용입니다. 이후 Apps Script를 통해 Google Sheets와 연결할 수 있습니다."}}, "overview": {"en": {"orientation_title": "Student Orientation: Why This Matters This Week", "orientation": "In this week’s lecture we learn how to hear the Prophets rightly. Instead of treating them as fortune-tellers about our future, we hear them as God’s messengers speaking first to their own time. By the end, students should be able to explain the prophet’s main job, recognize major prophetic forms—judgment, woe, lawsuit, promise, and symbolic action—and connect a prophetic passage to its situation in Israel’s history. The core movement is simple: first ask what it meant then, and then ask what it means here and now for life and community.", "claim_title": "Unified Hermeneutical Claim", "claim": "The Prophetic Books are not a coded archive of predictions about distant modern events. They are the authoritative speech of covenant enforcement mediators—ambassadors divinely compelled to apply the established legal stipulations of the Torah to the immediate national crises of their own generation. Hearing them correctly requires rigorous exegesis anchored in the historical particularity of the eighth to fifth centuries BC, and a hermeneutical spiral that moves from original meaning toward contemporary significance without collapsing the distance between the two horizons.", "where": "A covenant courtroom: God, the divine Suzerain, brings a formal lawsuit (rîb) against Israel, the unfaithful vassal, for breaking the Sinai stipulations in specific crises from the eighth to fifth centuries BC.", "who": "The reader moves from “fortune-teller hunter” to illumined participant: neither an inspired writer nor a neutral observer, but a covenant listener called to repentance, loyalty, and wise contemporary discernment.", "what": "The vocation is covenant loyalty and orthopraxy. Prophetic texts do not call mainly for intellectual curiosity but for correct belief about God’s covenantal character and embodied faithfulness in response.", "module_index_title": "Module Map", "student_note": "This app uses the Week 11 full-screen adaptive structure and rebuilds it for Week 12 Prophets. The professor-only architecture brief is not treated as student lecture content; it informs the glossary and anchors."}, "ko": {"orientation_title": "학생 오리엔테이션: 이번 주가 왜 중요한가", "orientation": "이번 주 강의는 예언서를 올바르게 듣는 방법을 배우는 시간입니다. 예언자를 우리의 미래를 맞히는 점쟁이처럼 대하지 않고, 먼저 자기 시대를 향해 하나님의 말씀을 전한 사자로 듣습니다. 수업이 끝날 때 학생들은 예언자의 핵심 역할을 설명하고, 심판, 화, 소송, 약속, 상징행동과 같은 주요 예언 형식을 인식하며, 예언 본문을 이스라엘 역사 속의 구체적 상황과 연결할 수 있어야 합니다. 핵심 이동은 단순합니다. 먼저 “그때 그곳에서 무엇을 의미했는가?”를 묻고, 그 다음 “여기 오늘 우리의 삶과 공동체에 무엇을 의미하는가?”를 묻는 것입니다.", "claim_title": "통합 해석학 주장", "claim": "예언서는 먼 현대 사건을 맞히기 위한 암호화된 예측 자료가 아닙니다. 예언서는 언약 집행 중재자의 권위 있는 말입니다. 예언자는 하나님께 부름받은 사절로서, 이미 토라 안에 세워진 언약 규정을 자기 세대의 즉각적인 국가적 위기에 적용했습니다. 예언서를 바르게 들으려면 두 훈련이 함께 필요합니다. 하나는 주전 8세기부터 5세기까지의 역사적 특수성에 뿌리내린 엄밀한 주해이고, 다른 하나는 원래 의미에서 오늘의 의미로 이동하되 두 지평 사이의 거리를 무너뜨리지 않는 해석학적 나선입니다.", "where": "언약 법정입니다. 하나님은 신적 종주로서, 시나이 언약 조항을 어긴 불충실한 봉신 이스라엘을 상대로 공식 소송(rîb)을 제기하십니다. 이 장은 주전 8세기부터 5세기까지의 구체적 역사 위기 속에 놓여 있습니다.", "who": "독자는 “미래 예측을 찾는 사람”에서 조명 받은 참여자로 이동합니다. 그는 영감 받은 성경 저자도 아니고 중립 관찰자도 아니라, 회개와 언약 충성, 그리고 지혜로운 현대적 분별로 부름받은 언약 청중입니다.", "what": "소명은 언약 충성과 orthopraxy, 곧 바르게 사는 것입니다. 예언 본문은 단순한 지적 호기심을 요구하지 않고, 하나님의 언약적 성품에 대한 바른 믿음과 그에 응답하는 embodied faithfulness를 요구합니다.", "module_index_title": "모듈 지도", "student_note": "이 앱은 11주차 전체 화면 Adaptive 구조를 사용하여 12주차 예언서 수업용으로 재구성되었습니다. 교수자 전용 아키텍처 브리프는 학생 강의 본문으로 배포하지 않고, 용어 사전과 WHERE–WHO–WHAT 앵커 형성에만 반영했습니다."}}, "modules": [{"id": "m1", "en": {"title": "M1 — Dismantling the Predictive Myth", "ask": "What do most people get wrong about the Prophets, and what do scholars say instead?", "student": "Many Christians think the Prophets are mainly about predicting events in our future. Fee and Stuart show that only a very small part of prophetic texts function that way. Most prophetic messages were spoken to real people, in real crises, between about 760 and 460 BC. The prophets were not giving secret codes about twenty-first-century news; they were calling Israel back to God’s covenant in their own day.", "body": ["We begin with a confession about the WHERE most readers bring to these sixteen books. The dominant popular assumption is that the prophets are primarily fortune-tellers—a coded archive of predictions about distant modern events, available to those who compare the right headlines with the right verses.", "Douglas Stuart and Grant Osborne identify this assumption as a fundamental misreading. The statistical reality should arrest us: less than 2 percent of Old Testament prophecy is directly messianic, less than 5 percent concerns the new-covenant age, and less than 1 percent addresses events still future to our own time.", "The primary function of the prophet is not foretelling but forth-telling—speaking for God to contemporaries in a specific historical crisis. The relational field is not a crystal ball above time but a contested covenant relationship from roughly 760 to 460 BC, from the Assyrian threat under Amos and Hosea through the Babylonian exile and post-exilic reconstruction.", "Until readers recalibrate their entry point from predictive curiosity to covenantal attention, the prophetic books remain opaque—or worse, pliable to whatever contemporary crisis the interpreter already assumes they address."], "check": ["In one sentence, what is the difference between fore-telling and forth-telling?", "Why does it matter that less than 2% of prophecy is directly messianic?"], "guide": "Fore-telling predicts future events; forth-telling speaks God’s covenant word to the prophet’s own generation. The statistic matters because it shifts the reader’s focus away from decoding modern headlines and toward hearing the prophet’s original covenant summons."}, "ko": {"title": "M1 — 예측 중심 오해 해체하기", "ask": "사람들은 예언서에 대해 무엇을 가장 많이 오해하며, 학자들은 그 대신 무엇을 말하는가?", "student": "많은 그리스도인은 예언서가 주로 우리의 미래 사건을 예측한다고 생각합니다. 그러나 Fee와 Stuart는 예언 본문 가운데 그렇게 작동하는 부분은 매우 적다고 설명합니다. 대부분의 예언 메시지는 주전 760년부터 460년 사이 실제 위기 속에 있던 실제 사람들에게 주어진 말씀입니다. 예언자는 21세기 뉴스를 해독하게 하려고 비밀 암호를 준 것이 아니라, 자기 시대의 이스라엘을 하나님의 언약으로 다시 부른 것입니다.", "body": ["우리는 먼저 독자들이 예언서에 가지고 들어오는 WHERE를 고백해야 합니다. 대중적 가정은 예언자가 주로 미래를 맞히는 사람이라는 것입니다. 곧 예언서는 먼 현대 사건을 예측하는 암호화된 자료이고, 올바른 뉴스 제목과 올바른 구절을 맞추면 해독할 수 있다고 생각합니다.", "Douglas Stuart와 Grant Osborne은 이 가정을 근본적 오독으로 봅니다. 통계적 현실은 우리를 멈추게 합니다. 구약 예언 중 직접 메시아적 예언은 2% 미만이고, 새 언약 시대를 다루는 본문은 5% 미만이며, 오늘 우리 시대 이후의 사건을 다루는 본문은 1% 미만입니다.", "예언자의 일차 기능은 fore-telling, 곧 미래 예측이 아니라 forth-telling, 곧 자기 시대의 동시대인들에게 하나님의 말씀을 대언하는 것입니다. 관계적 장은 시간을 초월한 수정 구슬이 아니라, 주전 760년부터 460년까지의 논쟁적 언약 관계입니다. 이 장은 Amos와 Hosea 시대의 앗수르 위협에서 바벨론 포로와 포로 이후 재건까지 이어집니다.", "독자가 예측적 호기심에서 언약적 주의로 입구를 재조정하지 않는다면, 예언서는 계속 불투명하게 남거나, 더 나쁘게는 해석자가 이미 확신하는 현대 위기에 맞추어 마음대로 휘어지는 본문이 됩니다."], "check": ["한 문장으로 fore-telling과 forth-telling의 차이는 무엇입니까?", "직접 메시아적 예언이 2% 미만이라는 사실은 왜 중요합니까?"], "guide": "Fore-telling은 미래 사건을 예측하는 것이고, forth-telling은 예언자의 세대를 향해 하나님의 언약 말씀을 전하는 것입니다. 이 통계는 독자가 현대 뉴스 해독에서 벗어나 예언자의 원래 언약적 부름을 듣게 하기 때문에 중요합니다."}}, {"id": "m2", "en": {"title": "M2 — The Vocation: Covenant Enforcement Mediators", "ask": "What exactly was the prophet’s job?", "student": "If the prophet is not primarily a prognosticator, then their WHAT is covenant enforcement. Prophets were like prosecutors or royal ambassadors who reminded Israel of the covenant law and announced the consequences of obedience or disobedience. They did not invent new theology; they enforced the already-given covenant.", "body": ["Stuart’s category, adopted by Osborne, is precise: prophets are Covenant Enforcement Mediators. They are revivalists, covenant prosecutors, commissioned to announce whether Israel has remained faithful or broken faith with the Sinai agreement, and to declare the consequences accordingly.", "When Israel moved toward destruction, roughly 760–586 BC, the dominant prophetic register was curse: Stuart’s “Ten D’s”—death, disease, drought, dearth, danger, destruction, defeat, deportation, destitution, and disgrace. When destruction had occurred and the people were in exile, the register shifted toward blessing: life, health, prosperity, abundance, respect, and safety.", "The prophets did not fabricate these categories. They drew them from the covenantal blessings and curses already established in the Pentateuch, especially Leviticus 26 and Deuteronomy 28–30.", "The covenant was structured like a suzerain-vassal treaty: a great king makes a binding treaty with a smaller partner. God is the great king; Israel is the dependent partner. The prophets are ambassadors delivering the great king’s message, not independent visionaries constructing their own system."], "check": ["In one sentence, how would you define Covenant Enforcement Mediator?", "How do the Ten D’s connect back to Leviticus 26 and Deuteronomy 28–30?"], "guide": "A Covenant Enforcement Mediator announces the consequences of Israel’s fidelity or infidelity to the already-given covenant. The Ten D’s are not random disasters; they echo the covenant curses of Leviticus and Deuteronomy."}, "ko": {"title": "M2 — 소명: 언약 집행 중재자", "ask": "예언자의 정확한 직무는 무엇이었습니까?", "student": "예언자가 주로 미래 예측자가 아니라면, 그의 WHAT은 언약 집행입니다. 예언자는 검사나 왕의 사절처럼 이스라엘에게 언약법을 상기시키고, 순종과 불순종의 결과를 선포했습니다. 그들은 새 신학을 발명하지 않았고, 이미 주어진 언약을 집행했습니다.", "body": ["Stuart의 범주를 Osborne도 받아들이는데, 그 표현은 정확합니다. 예언자는 Covenant Enforcement Mediator, 곧 언약 집행 중재자입니다. 그들은 부흥가이자 언약 검사로서, 이스라엘이 시나이 언약에 충실했는지 아니면 언약을 깨뜨렸는지 선포하고 그 결과를 선언하도록 위임받았습니다.", "이스라엘이 멸망을 향해 가던 주전 760–586년에는 저주의 언어가 예언의 지배적 음조였습니다. Stuart의 “Ten D’s”는 죽음, 질병, 가뭄, 결핍, 위험, 파괴, 패배, 추방, 궁핍, 수치입니다. 멸망이 일어나고 백성이 포로가 된 후에는 생명, 건강, 번영, 풍요, 존중, 안전과 같은 복의 언어로 음조가 이동합니다.", "예언자들은 이 범주를 만들어낸 것이 아닙니다. 그들은 레위기 26장과 신명기 28–30장에 이미 세워진 언약적 복과 저주에서 그것을 가져왔습니다.", "언약은 종주-봉신 조약과 같은 구조를 가집니다. 큰 왕이 작은 파트너와 구속력 있는 조약을 맺는 것입니다. 하나님은 큰 왕이고, 이스라엘은 의존적 파트너입니다. 예언자는 자기 체계를 세우는 독립적 이상가가 아니라, 큰 왕의 메시지를 전달하는 사절입니다."], "check": ["한 문장으로 언약 집행 중재자를 어떻게 정의하겠습니까?", "Ten D’s는 레위기 26장과 신명기 28–30장과 어떻게 연결됩니까?"], "guide": "언약 집행 중재자는 이미 주어진 언약에 대한 이스라엘의 충성 또는 불충성의 결과를 선포하는 사람입니다. Ten D’s는 임의의 재난이 아니라 레위기와 신명기의 언약 저주를 반영합니다."}}, {"id": "m3", "en": {"title": "M3 — The Identity of the Prophet: Nābīʾ", "ask": "Who is the prophet as a person, and why does that matter?", "student": "Osborne’s analysis of the Hebrew term nābīʾ (נָבִיא) shows a twofold movement. Passively, the prophet receives God’s message through divine revelation. Actively, the prophet interprets and proclaims that received message to a specific audience in a specific moment.", "body": ["The WHO of the prophet is theologically significant. The prophet is not an independent moral philosopher, political commentator, or religious entrepreneur. The prophet is God’s mouthpiece.", "The passive side means the prophet is filled with the Spirit and receives God’s message through vision, audition, or direct address. This reception is not self-initiated; prophets are often reluctant or resistant to the commission they receive.", "The active side means the prophet interprets and proclaims the received message to a concrete audience. The transition from reception to proclamation is the defining prophetic act.", "Unlike king or priestly roles, the prophet never inherits the vocation. The prophet is seized by divine will and speaks under the “constraint of Yahweh.” The messenger formula “Thus says the LORD” reflects royal emissary protocol: the ambassador delivers another’s declaration."], "check": ["What does the word nābīʾ tell us about the prophet’s identity?", "Why does it matter that the prophet never inherits the vocation?"], "guide": "Nābīʾ presents the prophet as one who both receives and proclaims God’s word. The non-inherited vocation matters because prophetic authority comes from divine summons, not social status or family lineage."}, "ko": {"title": "M3 — 예언자의 정체성: Nābīʾ", "ask": "인격으로서 예언자는 누구이며, 그것은 왜 중요합니까?", "student": "히브리어 nābīʾ(נָבִיא)에 대한 Osborne의 분석은 두 방향의 움직임을 보여 줍니다. 수동적으로 예언자는 하나님의 계시를 통해 메시지를 받습니다. 능동적으로 예언자는 받은 메시지를 특정 순간의 특정 청중에게 해석하고 선포합니다.", "body": ["예언자의 WHO는 신학적으로 중요합니다. 예언자는 독립적 도덕 철학자도, 정치 논평가도, 종교 사업가도 아닙니다. 예언자는 하나님의 mouthpiece, 곧 하나님의 말씀을 대언하는 사람입니다.", "수동적 측면은 예언자가 성령으로 충만하여 환상, 청각적 계시, 직접 말씀을 통해 하나님의 메시지를 받는다는 뜻입니다. 이 수신은 스스로 시작한 것이 아닙니다. 예언자들은 종종 받은 소명에 대해 주저하거나 저항합니다.", "능동적 측면은 예언자가 받은 메시지를 구체적 청중에게 해석하고 선포한다는 뜻입니다. 수신에서 선포로의 전환이 예언 행위의 핵심입니다.", "왕이나 제사장과 달리 예언자는 소명을 상속하지 않습니다. 예언자는 하나님의 뜻에 붙잡히며 “야훼의 강권” 아래 말합니다. “여호와께서 이와 같이 말씀하신다”는 사자 공식은 고대 왕실 사절의 프로토콜을 반영합니다. 사절은 자기 말이 아니라 보낸 분의 선언을 전달합니다."], "check": ["nābīʾ라는 단어는 예언자의 정체성에 대해 무엇을 알려 줍니까?", "예언자가 소명을 상속하지 않는다는 사실은 왜 중요합니까?"], "guide": "Nābīʾ는 예언자를 하나님의 말씀을 받고 선포하는 사람으로 보여 줍니다. 소명을 상속하지 않는다는 사실은 예언자의 권위가 사회적 지위나 혈통이 아니라 하나님의 부르심에서 온다는 점을 보여 줍니다."}}, {"id": "m4", "en": {"title": "M4 — The Forms of the Oracle: Thinking in Genres", "ask": "What are the main forms a prophetic oracle takes?", "student": "Most prophetic books are collections of discrete spoken units, often in poetry, not flowing prose essays. Learning the form of an oracle helps readers know the rhetorical posture of the text and the response it demands.", "body": ["The exegetical task requires learning to think in oracles. Identifying the literary subgenre is not a mere academic exercise; it determines whether the text is accusing, mourning, litigating, promising, or embodying judgment through action.", "Stuart and Osborne identify five primary forms. First is the Judgment Speech (Gerichtswort): messenger formula, accusation naming the covenant violation, and prediction of disaster. Amos 2:6–8 is a classic example.", "Second is the Woe Oracle, opening with hôy, a funeral-lament word. “Woe” is not mere anger; it is a prophetic funeral cry because Israel’s covenant unfaithfulness has already made death visible before judgment fully arrives.", "Third is the Lawsuit (rîb): a formal summons to the divine court in which God calls witnesses, establishes guilt, and pronounces judgment. Fourth is the Promise Oracle, announcing salvation and future transformation, especially after exile. Fifth is Symbolic Action: acted prophecy, such as Isaiah walking stripped and barefoot or Jeremiah smashing a clay jar.", "Once readers identify these forms, the prophetic books cease to be a uniform monotone of divine complaint. Each oracle has its own emotional register and implied demand."], "tryit": ["Choose one short prophetic passage of 5–8 verses.", "Ask: Is this judgment, woe, lawsuit, promise, or symbolic action?", "What clues in the text help you decide?", "If judgment speech, can you find messenger formula, accusation, and announcement?"], "check": ["What are the three parts of a Judgment Speech?", "Why does the prophet use a funeral word (hôy) before judgment has actually arrived?"], "guide": "Judgment speech usually includes messenger formula, accusation, and disaster announcement. Hôy sounds like funeral lament because the prophet mourns covenant death before the visible disaster arrives."}, "ko": {"title": "M4 — 신탁의 형식: 장르로 생각하기", "ask": "예언 신탁은 어떤 주요 형식으로 나타납니까?", "student": "대부분의 예언서는 유려한 산문 논문이 아니라, 종종 시적 형태를 지닌 개별 발화 단위들의 모음입니다. 신탁의 형식을 배우면 독자는 본문의 수사적 자세와 요구되는 반응을 알 수 있습니다.", "body": ["주해 과제는 신탁 단위로 생각하는 법을 배우는 것입니다. 문학적 하위 장르를 식별하는 것은 단순한 학문 연습이 아닙니다. 그것은 본문이 고발하는지, 애도하는지, 소송하는지, 약속하는지, 행동으로 심판을 embody하는지를 결정합니다.", "Stuart와 Osborne은 다섯 가지 주요 형식을 제시합니다. 첫째는 심판 연설(Gerichtswort)입니다. 이는 사자 공식, 언약 위반을 명명하는 고발, 그리고 재앙 예고로 구성됩니다. 아모스 2:6–8은 대표적 예입니다.", "둘째는 화 신탁입니다. 이는 장례 애가의 단어인 hôy로 시작합니다. “화 있을진저”는 단순한 분노가 아니라 예언자의 장례 외침입니다. 이스라엘의 언약 불충성이 이미 죽음을 드러냈기 때문에, 심판이 완전히 오기 전에 애도가 먼저 수행됩니다.", "셋째는 소송(rîb)입니다. 이는 하나님이 증인을 부르고, 죄를 확정하며, 판결을 선포하는 신적 법정의 공식 소환입니다. 넷째는 약속 신탁으로, 특히 포로 이후 구원과 미래 변화를 선포합니다. 다섯째는 상징행동입니다. 이는 이사야가 벗은 몸과 맨발로 다니거나 예레미야가 질그릇을 깨뜨리는 것처럼 행동으로 수행되는 예언입니다.", "독자가 이러한 형식을 식별하면 예언서는 더 이상 하나님의 불평이 단조롭게 반복되는 책이 아닙니다. 각 신탁은 고유한 감정의 음조와 청중에게 요구하는 반응을 가집니다."], "tryit": ["5–8절 정도의 짧은 예언 본문을 하나 선택하십시오.", "질문하십시오. 이것은 심판, 화, 소송, 약속, 상징행동 중 무엇입니까?", "본문의 어떤 단서가 판단을 도와 줍니까?", "심판 연설이라면 사자 공식, 고발, 선포를 찾을 수 있습니까?"], "check": ["심판 연설의 세 부분은 무엇입니까?", "예언자는 왜 심판이 실제로 오기 전에 장례 단어(hôy)를 사용합니까?"], "guide": "심판 연설은 보통 사자 공식, 고발, 재앙 선포로 구성됩니다. Hôy는 장례 애가처럼 들리는데, 이는 보이는 재앙이 오기 전에 예언자가 언약적 죽음을 애도하기 때문입니다."}}, {"id": "m5", "en": {"title": "M5 — The Exegetical Task: Grounding Oracles in History", "ask": "How do we find the historical situation behind a prophetic oracle?", "student": "Prophetic oracles must be located in history. Fee and Stuart distinguish the Larger Context—the era as a whole—and the Specific Context—the date, audience, and triggering situation of a given oracle.", "body": ["The WHERE of most prophetic oracles is a narrow and turbulent historical band. Without locating the text in the Assyrian, Babylonian, or post-exilic situation, the force of the oracle becomes muffled.", "Larger Context means the political, military, and religious landscape of the era. Amos speaks during false prosperity under Jeroboam II; Isaiah speaks under the shadow of Assyrian expansion; Jeremiah speaks as Babylonian catastrophe draws near.", "Specific Context means the particular date, audience, and trigger of an individual oracle. Hosea 5:8–12, for example, is a war oracle generated by the Syro-Ephraimite crisis of 734 BC. With that anchor, the covenantal logic of the curse becomes transparent.", "Osborne adds the telescoping of prophetic time. Prophetic speech can compress immediate crisis, exile, return, and eschatological horizon into one poetic vision. Isaiah 9:1–7 blends near relief from Assyrian threat with a far horizon of a coming king of peace.", "New Testament writers sometimes identify a fuller meaning (sensus plenior) under inspiration. Modern readers are illumined readers, not inspired writers. We may perceive such fulfillments where the New Testament identifies them, but we should not independently manufacture new sensus plenior."], "check": ["What is the difference between Larger Context and Specific Context?", "What does telescoping of prophetic time mean in your own words?"], "guide": "Larger Context is the broad era; Specific Context is the immediate occasion. Telescoping means the prophet can hold near and far horizons together in one vision without clearly separating them."}, "ko": {"title": "M5 — 주해 과제: 신탁을 역사에 뿌리내리기", "ask": "예언 신탁 뒤에 있는 역사적 상황을 어떻게 찾습니까?", "student": "예언 신탁은 반드시 역사 속에 위치해야 합니다. Fee와 Stuart는 더 큰 맥락, 곧 시대 전체와, 특정 맥락, 곧 개별 신탁의 날짜, 청중, 촉발 상황을 구별합니다.", "body": ["대부분의 예언 신탁의 WHERE는 좁고 격동적인 역사적 범위 안에 있습니다. 본문을 앗수르, 바벨론, 포로 이후의 상황 속에 위치시키지 않으면 신탁의 힘은 흐려집니다.", "더 큰 맥락은 그 시대의 정치적, 군사적, 종교적 지형을 뜻합니다. Amos는 Jeroboam II 아래 거짓 번영의 시대에 말하고, Isaiah는 앗수르 팽창의 그림자 아래 말하며, Jeremiah는 바벨론 재앙이 가까워지는 때 말합니다.", "특정 맥락은 개별 신탁의 구체적 날짜, 청중, 촉발 상황을 뜻합니다. 예를 들어 Hosea 5:8–12는 주전 734년 시리아-에브라임 위기에서 나온 전쟁 신탁입니다. 이 역사적 앵커가 있을 때 저주의 언약적 논리가 분명해집니다.", "Osborne은 예언 시간의 망원적 압축을 추가합니다. 예언 언어는 즉각적 위기, 포로, 귀환, 종말론적 지평을 하나의 시적 비전 안에 압축할 수 있습니다. Isaiah 9:1–7은 앗수르 위협에서의 가까운 구원과 평화의 왕이라는 먼 지평을 함께 엮습니다.", "신약 저자들은 영감 아래 때때로 fuller meaning, 곧 sensus plenior를 식별합니다. 현대 독자는 조명 받은 독자이지 영감 받은 저자가 아닙니다. 우리는 신약이 식별한 성취를 인식할 수 있지만, 스스로 새로운 sensus plenior를 만들어낼 권한은 없습니다."], "check": ["더 큰 맥락과 특정 맥락의 차이는 무엇입니까?", "예언 시간의 망원적 압축을 자신의 말로 설명해 보십시오."], "guide": "더 큰 맥락은 넓은 시대이고, 특정 맥락은 즉각적 상황입니다. 망원적 압축은 예언자가 가까운 지평과 먼 지평을 명확히 분리하지 않고 하나의 비전 안에 함께 담는 것을 뜻합니다."}}, {"id": "m6", "en": {"title": "M6 — The Hermeneutical Spiral: From Exegesis to Significance", "ask": "How do we move responsibly from what it meant then to what it means now?", "student": "The hermeneutical spiral is like learning a song by ear. First you listen carefully to the original recording—exegesis. Then you play it faithfully in your own setting—application. You do not change the melody, but each time you listen and play again, you understand it more deeply.", "body": ["Fee and Stuart’s interpretation method and Osborne’s Hermeneutical Spiral share a conviction: moving from text to application is not a simple transfer but a disciplined, iterative spiral.", "The need for interpretation arises from Scripture’s dual nature. The Bible is the Word of God given in human words in history. Therefore, it has eternal relevance because it is God’s word, and historical particularity because it came through specific human words in specific moments.", "Osborne’s spiral is not a closed circle that merely confirms the reader’s assumptions. It is an open-ended movement that narrows progressively toward intended meaning and then widens toward contemporary significance.", "The spiral operates on three levels: exegesis, asking what the text meant for first hearers; devotion, asking how the text speaks to my life with God; and proclamation, asking how this word might be shared with others. The error lies in skipping exegesis and building devotion or proclamation on unsupported impressions."], "check": ["In your own words, describe what a spiral, rather than a straight line, means for interpretation.", "Why is it dangerous to skip exegesis and jump straight to application?"], "guide": "A spiral returns to the text repeatedly, each time with deeper understanding. Skipping exegesis is dangerous because application then becomes self-projection rather than faithful hearing."}, "ko": {"title": "M6 — 해석학적 나선: 주해에서 의미로", "ask": "“그때 의미”에서 “오늘 의미”로 어떻게 책임 있게 이동합니까?", "student": "해석학적 나선은 귀로 노래를 배우는 것과 같습니다. 먼저 원곡을 주의 깊게 듣습니다. 이것이 주해입니다. 그 다음 자신의 자리에서 충실하게 연주합니다. 이것이 적용입니다. 멜로디를 바꾸지는 않지만, 다시 듣고 다시 연주할 때마다 더 깊이 이해하게 됩니다.", "body": ["Fee와 Stuart의 해석 방법과 Osborne의 Hermeneutical Spiral은 같은 확신을 공유합니다. 본문에서 적용으로 이동하는 것은 단순한 전이가 아니라 훈련된 반복적 나선입니다.", "해석이 필요한 이유는 성경의 이중적 성격에서 나옵니다. 성경은 역사 속 인간의 말로 주어진 하나님의 말씀입니다. 따라서 하나님의 말씀이기 때문에 영원한 관련성을 가지며, 동시에 특정 순간의 특정 인간 언어로 주어졌기 때문에 역사적 특수성을 가집니다.", "Osborne의 나선은 독자의 전제를 반복 확인하는 닫힌 원이 아닙니다. 그것은 의도된 의미를 향해 점점 좁혀 들어가고, 다시 오늘의 의미를 향해 넓어지는 열린 움직임입니다.", "이 나선은 세 수준에서 작동합니다. 주해는 첫 청중에게 본문이 무엇을 의미했는지 묻습니다. 경건적 appropriation은 본문이 나의 하나님과의 삶에 어떻게 말하는지 묻습니다. 선포는 이 말씀을 다른 사람과 어떻게 나눌 수 있는지 묻습니다. 오류는 첫 단계인 주해를 건너뛰고 지지되지 않은 인상 위에 경건과 선포를 세우는 데 있습니다."], "check": ["직선이 아니라 나선이라는 말은 해석에서 무엇을 뜻합니까?", "주해를 건너뛰고 곧바로 적용으로 가는 것이 왜 위험합니까?"], "guide": "나선은 본문으로 반복해서 돌아가면서 매번 더 깊은 이해를 얻는 과정입니다. 주해를 건너뛰면 적용은 충실한 들음이 아니라 자기 투사가 되기 때문에 위험합니다."}}, {"id": "m7", "en": {"title": "M7 — The Two Tasks: Exegesis and Hermeneutics", "ask": "What two basic rules guide every act of interpretation?", "student": "Fee’s first rule: a text cannot mean what it could never have meant for the original readers. His second bridge rule: when our situation is truly similar to theirs, God’s word to them still speaks in the same way to us.", "body": ["Exegesis is the careful, systematic study of Scripture to discover the original, intended meaning. It is the attempt to hear the word as the original recipients heard it.", "Good exegesis asks contextual questions first: Who is writing? To whom? When? What is happening? How does this paragraph fit in the whole book? It then asks content questions: What do key words mean here? Are there repeated ideas or images? How do the sentences connect?", "Fee insists that readers must think in paragraphs rather than isolated verses. The crucial literary question is always: What is the point of this unit?", "The basic rule of hermeneutics protects the text from foreign meanings: a text cannot mean what it could never have meant. The bridge rule then allows legitimate movement: wherever contemporary readers share comparable particulars with the original audience, God’s word carries similar force."], "check": ["Why does Fee say we must think in paragraphs rather than verses?", "Give one example of a situation where our context is truly similar to the original audience’s."], "guide": "Paragraphs preserve the author’s train of thought, while isolated verses are easy to misuse. Similarity occurs when communities today repeat comparable covenant dynamics, such as worship without justice or security-seeking without faithfulness."}, "ko": {"title": "M7 — 두 과제: 주해와 해석", "ask": "모든 해석 행위를 인도하는 두 기본 규칙은 무엇입니까?", "student": "Fee의 첫 번째 규칙은 이것입니다. 본문은 원래 독자에게 결코 의미할 수 없었던 것을 오늘 의미할 수 없습니다. 두 번째 연결 규칙은 이것입니다. 우리의 상황이 그들의 상황과 참으로 유사할 때, 그들에게 주어진 하나님의 말씀은 우리에게도 같은 방식으로 말합니다.", "body": ["주해는 성경의 원래 의도된 의미를 발견하기 위한 조심스럽고 체계적인 연구입니다. 그것은 원래 수신자가 들었던 방식으로 말씀을 들으려는 시도입니다.", "좋은 주해는 먼저 맥락 질문을 던집니다. 누가 쓰는가? 누구에게 쓰는가? 언제인가? 무슨 일이 일어나고 있는가? 이 단락은 책 전체 안에서 어떻게 기능하는가? 그 다음 내용 질문을 던집니다. 핵심 단어는 여기서 무엇을 뜻하는가? 반복되는 생각이나 이미지가 있는가? 문장들은 어떻게 연결되는가?", "Fee는 독자가 고립된 절이 아니라 단락으로 생각해야 한다고 강조합니다. 핵심 문학 질문은 언제나 이것입니다. 이 단위의 요점은 무엇인가?", "해석학의 기본 규칙은 본문을 외부 의미의 부과로부터 보호합니다. 본문은 원래 의미할 수 없었던 것을 의미할 수 없습니다. 연결 규칙은 그 다음 정당한 이동을 허용합니다. 현대 독자가 원래 청중과 비교 가능한 특수성을 공유할 때, 하나님의 말씀은 비슷한 힘으로 오늘도 말합니다."], "check": ["Fee가 절이 아니라 단락으로 생각해야 한다고 말하는 이유는 무엇입니까?", "우리의 상황이 원래 청중의 상황과 참으로 유사한 경우를 한 가지 예로 들어 보십시오."], "guide": "단락은 저자의 사고 흐름을 보존하지만, 고립된 절은 오용되기 쉽습니다. 오늘 공동체가 정의 없는 예배나 충성 없는 안전 추구와 같이 비슷한 언약 역학을 반복할 때 유사성이 발생합니다."}}, {"id": "m8", "en": {"title": "M8 — Genre-Specific Principles and the Prophetic Context", "ask": "What special reading rules apply specifically to prophetic texts?", "student": "Prophetic books cannot be read by the same rules as Pauline letters or wisdom literature. Genre gives the rules of the language game. If we flatten all prophecy into direct prediction or direct command, we misread it.", "body": ["For prophetic texts, readers must attend to poetic parallelism. Most oracles are Hebrew poetry. The second line often develops, intensifies, or nuances the first; it does not merely repeat it.", "Readers must attend to occasional address. Like Paul’s letters, prophetic oracles arise from specific occasions. Interpreters must reconstruct the other end of the conversation: the historical crisis the prophet addresses.", "Readers must attend to typological resonance. Prophets speak in patterns that resonate across multiple historical moments. But typology does not license arbitrary modern application; it requires structural analogy governed by covenantal logic.", "Readers must attend to intertextual grounding. Prophetic imagery is saturated with Pentateuchal allusion. Curses, blessings, exile, and return all presuppose Torah fluency. To read the prophets well, one must read them against the law they enforce."], "check": ["What does it mean that prophetic books are occasional?", "Why can’t we read prophecy with the same rules as a Pauline letter?"], "guide": "Occasional means an oracle addresses a concrete crisis. Prophecy differs from epistle because it is usually poetic, covenantal, oracle-based, and grounded in Torah patterns rather than sustained letter argument."}, "ko": {"title": "M8 — 장르별 원리와 예언 문맥", "ask": "예언 본문에는 어떤 특별한 읽기 규칙이 적용됩니까?", "student": "예언서는 바울 서신이나 지혜문학과 같은 규칙으로 읽을 수 없습니다. 장르는 언어 게임의 규칙을 제공합니다. 모든 예언을 직접 예측이나 직접 명령으로 평면화하면 오독하게 됩니다.", "body": ["예언 본문을 읽을 때 독자는 시적 평행법에 주의해야 합니다. 대부분의 신탁은 히브리 시입니다. 둘째 행은 첫째 행을 단순 반복하지 않고 발전시키거나 강화하거나 뉘앙스를 더합니다.", "독자는 상황적 발화에 주의해야 합니다. 바울 서신처럼 예언 신탁도 특정 상황에서 나옵니다. 해석자는 대화의 다른 쪽 끝, 곧 예언자가 다루는 역사적 위기를 재구성해야 합니다.", "독자는 유형론적 공명에 주의해야 합니다. 예언자는 여러 역사적 순간을 가로질러 공명하는 패턴으로 말합니다. 그러나 유형론은 임의의 현대 적용을 허락하지 않습니다. 언약 논리가 지배하는 구조적 유비가 입증되어야 합니다.", "독자는 상호본문적 근거에 주의해야 합니다. 예언 이미지에는 오경의 암시가 가득합니다. 저주, 복, 포로, 귀환은 모두 토라에 대한 이해를 전제합니다. 예언자를 잘 읽으려면, 그들이 집행하는 율법을 배경으로 읽어야 합니다."], "check": ["예언서가 “상황적”이라는 말은 무엇을 뜻합니까?", "왜 예언서를 바울 서신과 같은 규칙으로 읽을 수 없습니까?"], "guide": "상황적이라는 말은 신탁이 구체적 위기에 말한다는 뜻입니다. 예언은 보통 시적이고, 언약적이며, 신탁 단위로 구성되고, 지속적 서신 논증보다 토라 패턴에 뿌리내리기 때문에 서신과 다릅니다."}}, {"id": "m9", "en": {"title": "M9 — Integration: From Illumined Reading to Orthopraxy", "ask": "What is the formation destination of prophetic interpretation?", "student": "The goal is not historical curiosity or predictive fascination. The goal is orthopraxy—correct living in covenantal response to the God who enforces covenant faithfulness.", "body": ["The prophetic texts press contemporary readers toward a WHAT: embodied covenant response. Osborne’s synthesis is direct: prophetic condemnation of social injustice, economic exploitation, empty religious performance, and covenantal unfaithfulness is as urgent now as it was in the eighth century.", "The structural conditions have changed; the covenantal logic has not. Where communities exploit the poor, perform worship while ignoring justice, or seek political and military security while abandoning covenant faithfulness, the prophetic word still carries force.", "The reader’s identity is reframed: from fortune-teller hunter to illumined participant; from predictive decoder to covenant-formed practitioner. The illumined reader cannot manufacture new sensus plenior, but is obligated to identify where the same covenantal dynamics are operative today.", "Closing formation question: What specific covenantal breach in your own community—in economic justice, religious performance, or political allegiance—would the eighth-century prophets name first if they were standing among you today? What would their messenger formula sound like directed at your WHERE?"], "check": ["What is the difference between orthodoxy and orthopraxy?", "In one sentence, describe the movement this lecture calls you to make—from what kind of reader to what kind of reader?"], "guide": "Orthodoxy means right belief; orthopraxy means right embodied practice. This lecture calls the reader to move from predictive decoder to covenant-formed, illumined participant who hears and embodies the prophetic word."}, "ko": {"title": "M9 — 통합: 조명 받은 읽기에서 Orthopraxy로", "ask": "예언서 해석의 형성 목적지는 무엇입니까?", "student": "목표는 역사적 호기심이나 예측적 매혹이 아닙니다. 목표는 orthopraxy, 곧 언약 충성을 집행하시는 하나님께 언약적으로 응답하며 바르게 사는 것입니다.", "body": ["예언 본문은 현대 독자를 하나의 WHAT, 곧 embodied covenant response로 밀어냅니다. Osborne의 종합은 분명합니다. 사회적 불의, 경제적 착취, 공허한 종교 수행, 언약 불충실에 대한 예언자의 정죄는 8세기 때만큼이나 오늘도 긴급합니다.", "구조적 조건은 달라졌지만 언약적 논리는 변하지 않았습니다. 공동체가 가난한 자를 착취하고, 정의를 무시한 채 예배를 수행하며, 언약 충성을 버리고 정치적·군사적 안전을 추구할 때, 예언의 말씀은 여전히 힘을 가집니다.", "독자의 정체성은 재구성됩니다. 그는 미래 예측을 찾는 사람에서 조명 받은 참여자로, 예측 해독자에서 언약에 의해 형성된 실천자로 이동합니다. 조명 받은 독자는 새로운 sensus plenior를 만들어낼 수 없지만, 동일한 언약 역학이 오늘 어디서 작동하는지 식별해야 할 책임이 있습니다.", "마지막 형성 질문은 이것입니다. 경제 정의, 종교 수행, 정치적 충성의 영역에서 당신의 공동체 안에 있는 구체적 언약 위반은 무엇입니까? 8세기 예언자들이 오늘 여러분 가운데 서 있다면 무엇을 먼저 지적할까요? 당신의 WHERE를 향한 그들의 사자 공식은 어떻게 들릴까요?"], "check": ["Orthodoxy와 orthopraxy의 차이는 무엇입니까?", "이 강의가 요청하는 이동을 한 문장으로 말해 보십시오. 어떤 독자에서 어떤 독자로 이동합니까?"], "guide": "Orthodoxy는 바른 믿음이고, orthopraxy는 바른 embodied practice입니다. 이 강의는 독자를 예측 해독자에서 예언의 말씀을 듣고 embody하는 언약 형성적 조명 받은 참여자로 이동시킵니다."}}], "glossary": [["Forth-telling", "Fee & Stuart, Osborne", "Speaking God's word directly to one's own contemporaries; the primary function of the prophetic vocation.", "동시대인을 향해 하나님의 말씀을 직접 말하는 것. 예언자 소명의 일차 기능."], ["Fore-telling", "Fee & Stuart, Osborne", "Predicting future events; a secondary instrument subordinate to forth-telling.", "미래 사건을 예측하는 것. forth-telling에 종속되는 이차적 도구."], ["Covenant Enforcement Mediator", "Stuart, Osborne", "One who announces the enforcement of God's already-established law—blessings for fidelity and curses for disobedience.", "하나님이 이미 세우신 법의 집행, 곧 충성에 대한 복과 불순종에 대한 저주를 선포하는 사람."], ["The Ten D's", "Stuart", "Death, disease, drought, dearth, danger, destruction, defeat, deportation, destitution, and disgrace.", "죽음, 질병, 가뭄, 결핍, 위험, 파괴, 패배, 추방, 궁핍, 수치."], ["Oracle", "Stuart", "A discrete spoken message from God, often in poetic form.", "하나님에게서 온 개별 발화 메시지. 대개 시적 형태를 가진다."], ["Nābīʾ (נָבִיא)", "Osborne", "Hebrew term for prophet, including passive reception and active proclamation.", "예언자를 뜻하는 히브리어. 수동적 수신과 능동적 선포를 함께 포함한다."], ["Judgment Speech", "Osborne", "Messenger formula, accusation, and announcement of disaster.", "사자 공식, 고발, 재앙 선포로 구성되는 심판 신탁."], ["Woe Oracle", "Osborne", "A judgment prophecy opening with hôy, a funeral lament word.", "장례 애가의 단어 hôy로 시작하는 심판 예언."], ["Rîb (רִיב)", "Stuart, Osborne", "Covenant lawsuit: God acts as suzerain, plaintiff, and judge.", "언약 소송. 하나님이 종주, 원고, 재판장으로 행동하신다."], ["Sensus Plenior", "Stuart, Osborne", "A fuller meaning identified by New Testament writers under inspiration, not independently generated by modern readers.", "신약 저자들이 영감 아래 식별한 fuller meaning. 현대 독자가 독립적으로 만들어내는 의미가 아니다."], ["Hermeneutical Spiral", "Osborne", "Open-ended iterative movement from original horizon toward contemporary significance.", "원래 지평에서 오늘의 의미로 나아가는 열린 반복적 이동."], ["Exegesis", "Fee & Stuart, Osborne", "Historically anchored task of determining what the text meant in its original context.", "본문이 원래 문맥에서 무엇을 의미했는지 밝히는 역사적으로 뿌리내린 과제."], ["Hermeneutics", "Fee & Stuart", "Discerning what the text means in the contemporary here and now, controlled by exegesis.", "주해에 의해 통제되며 본문이 오늘 여기서 무엇을 의미하는지 분별하는 과제."], ["Historical Particularity", "Fee", "Each biblical document is shaped by the language, culture, and time of its original composition.", "각 성경 문서는 원래 기록된 언어, 문화, 시대에 의해 형성된다는 사실."], ["Orthopraxy", "Stuart, Osborne", "Correct living as the goal of prophetic hearing.", "예언 말씀을 듣는 목적지로서의 바른 삶."]], "coreTexts": [{"day_en": "Tuesday", "day_ko": "화요일", "ref": "Amos 2:6–8", "title_en": "Judgment Speech Against Social Exploitation", "title_ko": "사회적 착취에 대한 심판 연설", "focus_en": "Judgment speech · accusation · covenant breach", "focus_ko": "심판 연설 · 고발 · 언약 위반", "exe_en": "Identify the messenger formula, accusation, and announced judgment. What specific covenant violation does Amos name?", "exe_ko": "사자 공식, 고발, 선포된 심판을 식별하십시오. Amos는 어떤 구체적 언약 위반을 지적합니까?", "her_en": "Where do worshiping communities today risk separating religious practice from economic justice?", "her_ko": "오늘 예배하는 공동체는 어디에서 종교 수행과 경제 정의를 분리할 위험이 있습니까?", "id": "amos_2_6_8", "integration_en": "Because Amos 2:6–8 speaks first as judgment speech · accusation · covenant breach, we should move from original covenant meaning to contemporary embodied faithfulness by _____.", "integration_ko": "Amos 2:6–8은 먼저 심판 연설 · 고발 · 언약 위반로 말하기 때문에, 우리는 원래 언약적 의미에서 오늘의 삶으로 구현되는 신실함으로 이동하며 _____해야 한다."}, {"day_en": "Tuesday", "day_ko": "화요일", "ref": "Isaiah 5:8–10", "title_en": "Woe Oracle Against Land Accumulation", "title_ko": "토지 축적에 대한 화 신탁", "focus_en": "hôy · funeral lament · elite greed", "focus_ko": "hôy · 장례 애가 · 엘리트 탐욕", "exe_en": "How does the word hôy shape the emotional force of the oracle before judgment arrives?", "exe_ko": "심판이 오기 전에 hôy라는 단어는 신탁의 정서적 힘을 어떻게 형성합니까?", "her_en": "What forms of “joining house to house” appear in contemporary economic or institutional life?", "her_ko": "오늘의 경제적 또는 제도적 삶에서 “집에 집을 더하는” 방식은 어떤 모습으로 나타납니까?", "id": "isaiah_5_8_10", "integration_en": "Because Isaiah 5:8–10 speaks first as hôy · funeral lament · elite greed, we should move from original covenant meaning to contemporary embodied faithfulness by _____.", "integration_ko": "Isaiah 5:8–10은 먼저 hôy · 장례 애가 · 엘리트 탐욕로 말하기 때문에, 우리는 원래 언약적 의미에서 오늘의 삶으로 구현되는 신실함으로 이동하며 _____해야 한다."}, {"day_en": "Tuesday", "day_ko": "화요일", "ref": "Micah 6:1–8", "title_en": "Rîb: The Covenant Lawsuit", "title_ko": "Rîb: 언약 소송", "focus_en": "lawsuit · witnesses · justice, mercy, humility", "focus_ko": "소송 · 증인 · 정의, 인애, 겸손", "exe_en": "Who are the participants in the covenant courtroom, and what does God require after the accusation?", "exe_ko": "언약 법정의 참여자는 누구이며, 고발 이후 하나님은 무엇을 요구하십니까?", "her_en": "How can Micah 6:8 correct communities that replace justice and mercy with religious performance?", "her_ko": "Micah 6:8은 정의와 인애를 종교적 수행으로 대체하는 공동체를 어떻게 교정합니까?", "id": "micah_6_1_8", "integration_en": "Because Micah 6:1–8 speaks first as lawsuit · witnesses · justice, mercy, humility, we should move from original covenant meaning to contemporary embodied faithfulness by _____.", "integration_ko": "Micah 6:1–8은 먼저 소송 · 증인 · 정의, 인애, 겸손로 말하기 때문에, 우리는 원래 언약적 의미에서 오늘의 삶으로 구현되는 신실함으로 이동하며 _____해야 한다."}, {"day_en": "Friday", "day_ko": "금요일", "ref": "Hosea 11:1–9", "title_en": "Covenant Memory and Divine Compassion", "title_ko": "언약 기억과 하나님의 긍휼", "focus_en": "larger context · original meaning · later NT resonance", "focus_ko": "더 큰 맥락 · 원래 의미 · 신약의 후속 공명", "exe_en": "In Hosea’s original context, who is “my son,” and what covenant memory is being recalled?", "exe_ko": "Hosea의 원래 문맥에서 “내 아들”은 누구이며, 어떤 언약 기억이 회상됩니까?", "her_en": "How should illumined readers receive Matthew’s later use of Hosea 11:1 without inventing new sensus plenior?", "her_ko": "조명 받은 독자는 새로운 sensus plenior를 만들어내지 않으면서 Matthew의 Hosea 11:1 사용을 어떻게 받아들여야 합니까?", "id": "hosea_11_1_9", "integration_en": "Because Hosea 11:1–9 speaks first as larger context · original meaning · later nt resonance, we should move from original covenant meaning to contemporary embodied faithfulness by _____.", "integration  if(kind==='osborne') return ['당신은 답을 대신 만들어 주는 기계가 아니라 예언서 해석 코치입니다.','',`본문: ${title}`,'','우리의 첫 답변:',...draft,'','최종 답을 먼저 주지 마세요. 먼저 강점 2개를 말하고, 3–5개의 수정 질문을 한 뒤, 어떤 방향으로 고쳐야 하는지 안내해 주세요.','','Osborne의 예언서 방법을 사용하세요:','- 신탁 형식을 식별하세요: 심판, 화, 소송(rîb), 약속, 상징행동.','- 시적 병행법과 수사적 힘을 보세요.','- Larger Context와 Specific Context를 구분하세요.','- 예언 시간의 망원적 압축을 조심스럽게 다루세요.','- sensus plenior를 현대 독자가 임의로 만들어내지 않게 하세요.'];
 if(kind==='www') return ['당신은 답을 대신 만들어 주는 기계가 아니라 WHERE–WHO–WHAT 해석 코치입니다.','',`본문: ${title}`,'','우리의 첫 답변:',...draft,'','최종 답을 먼저 주지 마세요. 먼저 강점 2개를 말하고, 3–5개의 수정 질문을 한 뒤, 어떤 방향으로 고쳐야 하는지 안내해 주세요.','','WHERE–WHO–WHAT 방법을 사용하세요:','- WHERE: 이 예언 말씀은 어떤 역사적·정치적·종교적·언약적 공간에서 주어졌습니까?','- WHO: 예언자, 청중, 하나님, 약자, 권력자는 각각 어떻게 위치합니까?','- WHAT: 이 말씀은 어떤 고발, 회개, 회복, 정의, orthopraxy를 요구합니까?'];
 return ['당신은 답을 대신 만들어 주는 기계가 아니라 성경해석학 코치입니다.','',`본문: ${title}`,'','우리의 첫 답변:',...draft,'','최종 답을 먼저 주지 마세요. 먼저 강점 2개를 말하고, 3–5개의 질문을 한 뒤, 무엇을 수정해야 하는지 설명하고, 마지막에만 수정 방향을 제안하세요.','','세 가지 방법을 모두 사용하세요:','1. Fee & Stuart: forth-telling, Covenant Enforcement Mediator, 역사적 특수성, exegesis before application.','2. Osborne: 신탁 장르, 예언 시간, hermeneutical spiral, sensus plenior 주의.','3. WHERE–WHO–WHAT: 위치, 정체성, 움직임, orthopraxy.'];
 }
 if(kind==='fee') return ['You are our biblical hermeneutics coach, not our answer generator.','',`Text: ${title}`,'','Our first answer:',...draft,'','Do not give the final answer first. Name two strengths, ask 3–5 revision questions, and help us improve.','','Use Fee & Stuart’s method for the Prophets:','- Prophets are forth-tellers, not fortune-tellers.','- Prophets are Covenant Enforcement Mediators.','- Read the text in historical particularity.','- Ask first “what it meant then,” then “what it means here and now.”','- Let original meaning control application.'];
 if(kind==='osborne') return ['You are our Prophets interpretation coach, not our answer generator.','',`Text: ${title}`,'','Our first answer:',...draft,'','Do not give the final answer first. Name two strengths, ask 3–5 revision questions, and help us improve.','','Use Osborne’s method for prophecy:','- Identify the oracle form: judgment, woe, lawsuit/rîb, promise, or symbolic action.','- Attend to poetic parallelism and rhetorical force.','- Distinguish Larger Context and Specific Context.','- Handle the telescoping of prophetic time carefully.','- Do not let modern readers invent new sensus plenior.'];

 return ['You are our biblical hermeneutics coach, not our answer generator.','',`Text: ${title}`,'','Our first answer:',...draft,'','Do not give the final answer first. First name two strengths, then ask 3–5 questions, then explain what needs revision, and only at the end suggest a revised direction.','','Use all three methods:','1. Fee & Stuart: forth-telling, Covenant Enforcement Mediator, historical particularity, exegesis before application.','2. Osborne: oracle genre, prophetic time, hermeneutical spiral, caution with sensus plenior.','3. WHERE–WHO–WHAT: location, identity, movement, and orthopraxy.'];
}
function promptHtml(kind){const lines=promptLines(kind); let out=''; let list=false; lines.forEach(line=>{ if(line===''){if(list){out+='</ul>';list=false} return} if(line.startsWith('- ')||/^\d+\. /.test(line)){ if(!list){out+='<ul>';list=true} out+=`<li>${esc(line.replace(/^\d+\. /,'' ).replace(/^- /,''))}</li>` } else { if(list){out+='</ul>';list=false} out+=`<p>${esc(line)}</p>` } }); if(list)out+='</ul>'; return out}
function copyPrompt(kind){navigator.clipboard.writeText(promptLines(kind).join(LB)).then(()=>toast(tr('Prompt copied','프롬프트가 복사되었습니다'))).catch(()=>toast(tr('Copy failed','복사 실패')))}
function promptCard(kind,en,ko,field){return `<div class="card"><h3>${tr(en,ko)}</h3><div class="promptBox">${promptHtml(kind)}</div><button class="primary" onclick="copyPrompt('${kind}')">${tr('Copy prompt','프롬프트 복사')}</button>${inputBlock('Paste AI’s coaching questions here','AI의 코칭 질문을 여기에 붙여 넣기',field,'Paste the questions AI asked. Do not paste only a final answer.','AI가 던진 질문을 붙여 넣으세요. 최종 답만 붙여 넣지 마세요.',true)}</div>`}
function renderCoaching(){return `<div class="hero"><span class="stageRibbon">${tr('Stage 1 · AI Coaching','1단계 · AI 코칭')}</span><h2>${tr('AI Coaching Prompts','AI 코칭 프롬프트')}</h2>${stationSelect()}<p class="subtitle">${tr('The visible prompt is rendered as readable paragraphs and bullet points. Students should not see literal backslash-n characters.','보이는 프롬프트는 읽기 쉬운 문단과 글머리표로 렌더링됩니다. 학생 화면에 문자 그대로의 백슬래시-n이 보이면 안 됩니다.')}</p></div><div class="grid two">${promptCard('fee','Fee & Stuart Coach','Fee & Stuart 코치','aiFee')}${promptCard('osborne','Osborne Coach','Osborne 코치','aiOsborne')}${promptCard('www','WHERE–WHO–WHAT Coach','WHERE–WHO–WHAT 코치','aiWWW')}${promptCard('full','Integrated Coach','통합 코치','aiFull')}</div>`}
function renderRevision(){return `<div class="hero"><span class="stageRibbon">${tr('Stage 1 · Revision','1단계 · 수정')}</span><h2>${tr('Individual Revision Log','개인 수정 기록')}</h2>${stationSelect()}<p class="subtitle">${tr('Record what changed after AI coaching. The professor should see movement from first answer to revised thinking.','AI 코칭 이후 무엇이 바뀌었는지 기록하세요. 교수자는 첫 답변에서 수정된 사고로의 움직임을 볼 수 있어야 합니다.')}</p></div><div class="card success">${inputBlock('What changed after AI interaction?','AI 상호작용 후 무엇이 바뀌었는가?','revisionNotes','I first thought..., but after AI asked..., I revised...','처음에는 ...라고 생각했지만, AI가 ...라고 질문한 뒤 나는 ...로 수정했다.')}</div><div class="grid three"><div class="card"><h3>Fee & Stuart</h3><p>${tr('Did you move from predictive myth to covenant enforcement?','예측 중심 오해에서 언약 집행으로 이동했습니까?')}</p></div><div class="card"><h3>Osborne</h3><p>${tr('Did you identify genre, context, and the hermeneutical spiral?','장르, 맥락, 해석학적 나선을 식별했습니까?')}</p></div><div class="card"><h3>WHERE–WHO–WHAT</h3><p>${tr('Did you clarify location, formed identity, and embodied response?','위치, 형성되는 정체성, 삶으로 구현되는 응답을 명료화했습니까?')}</p></div></div>`}
function renderGroupWork(){return `<div class="hero"><span class="stageRibbon">${tr('Stage 2 · Group Dialogue','2단계 · 그룹 대화')}</span><h2>${tr('Group Setup + Compare, Question, Negotiate','그룹 설정 + 비교하고, 질문하고, 협의하기')}</h2>${stationSelect()}<p class="subtitle">${tr('Stage 2 begins by forming the group. Each member brings their first answer and AI coaching questions. The group must negotiate a stronger shared answer rather than simply choosing the smoothest wording.','2단계는 그룹을 구성하는 것에서 시작합니다. 각 구성원은 자신의 첫 답변과 AI 코칭 질문을 가져옵니다. 그룹은 가장 매끄러운 문장을 고르는 것이 아니라 더 강한 공동 답변을 협의해야 합니다.')}</p></div><div class="card success"><h3>${tr('Group Setup','그룹 설정')}</h3><p class="muted">${tr('Assign roles here, inside Stage 2, so the group structure is connected directly to dialogue and synthesis.','그룹 구조가 대화와 종합에 직접 연결되도록 2단계 안에서 역할을 정하세요.')}</p><div class="grid two"><div>${globalInput('Group Name','그룹명','groupName','Group A','A조')}${globalInput('Members','구성원','members','Names of group members','그룹 구성원 이름')}</div><div>${globalInput('Text Reader','본문 읽기 담당','reader','Reads the biblical text aloud','본문을 소리 내어 읽는 사람')}${globalInput('Scribe','기록 담당','scribe','Types group answers','그룹 답변을 입력하는 사람')}${globalInput('AI Operator','AI 운영 담당','operator','Copies prompts and records AI questions','프롬프트를 복사하고 AI 질문을 기록하는 사람')}${globalInput('Presenter','발표 담당','presenter','Presents gallery card','갤러리 카드를 발표하는 사람')}</div></div></div><div class="card blue"><h3>${tr('Group dialogue protocol','그룹 대화 절차')}</h3><ol><li>${tr('Each member reads their first integration sentence.','각 구성원이 첫 통합 문장을 읽습니다.')}</li><li>${tr('Name one strength from each member’s answer.','각 답변의 강점 하나를 말합니다.')}</li><li>${tr('Choose two AI coaching questions that most improved the group’s thinking.','그룹 사고를 가장 개선한 AI 코칭 질문 두 개를 선택합니다.')}</li><li>${tr('Revise together using Fee & Stuart, Osborne, and WHERE–WHO–WHAT.','Fee & Stuart, Osborne, WHERE–WHO–WHAT으로 함께 수정합니다.')}</li></ol></div><div class="card">${inputBlock('Group dialogue notes','그룹 대화 기록','groupDialogue','What did members disagree about? What did the group decide to revise?','구성원들은 무엇에 대해 의견이 달랐습니까? 그룹은 무엇을 수정하기로 했습니까?')}</div>`}
function renderFinal(){const x=text(); return `<div class="hero"><span class="stageRibbon">${tr('Stage 2 · Final Synthesis','2단계 · 최종 종합')}</span><h2>${tr('Final Group Synthesis','최종 그룹 종합')}</h2>${stationSelect()}</div><div class="grid three"><div class="card"><h3>${tr('Group Exegesis','그룹 주해')}</h3><p><strong>${tr(x.exe_en,x.exe_ko)}</strong></p>${inputBlock('Final group exegesis answer','최종 그룹 주해 답변','groupExe','Use oracle form, historical setting, covenant breach, and rhetorical force.','신탁 형식, 역사 배경, 언약 위반, 수사적 힘을 사용하세요.')}</div><div class="card"><h3>${tr('Group Hermeneutics','그룹 해석학')}</h3><p><strong>${tr(x.her_en,x.her_ko)}</strong></p>${inputBlock('Final group hermeneutical answer','최종 그룹 해석학 답변','groupHer','Move from original meaning to contemporary significance without collapsing the distance.','원래 의미에서 오늘의 의미로 이동하되 거리를 무너뜨리지 마세요.')}</div><div class="card"><h3>${tr('Group Integration','그룹 통합')}</h3><p><strong>${tr(x.integration_en,x.integration_ko)}</strong></p>${inputBlock('Final group integration sentence','최종 그룹 통합 문장','groupIntegration','Because this prophetic word first..., today our community should...','이 예언 말씀이 먼저 ...이기 때문에, 오늘 우리 공동체는 ...해야 한다.')}</div></div><div class="card success"><h3>${tr('Concrete orthopraxy','구체적 orthopraxy')}</h3>${inputBlock('One embodied practice','삶으로 구현할 실천 하나','embodiedPractice','Name one concrete practice for classroom, church, campus, family, or society.','교실, 교회, 캠퍼스, 가정, 사회에서 실천할 수 있는 구체적 실천 하나를 쓰세요.')}</div>`}
function renderConsensus(){return `<div class="hero"><h2>${tr('Consensus / Concession Statement','합의 / 양보 진술')}</h2>${stationSelect()}</div><div class="card"><h3>${tr('After listening to others','다른 사람의 말을 들은 후')}</h3><p>${tr('A strong consensus statement shows learning through dialogue, not only through AI output.','좋은 합의 진술은 AI 출력만이 아니라 대화를 통해 배웠음을 보여 줍니다.')}</p>${inputBlock('Consensus / concession statement','합의 / 양보 진술','consensus','After listening, we realized... We revised... We still wonder...','함께 들은 후 우리는 ...을 깨달았다. 그래서 ...로 수정했다. 아직 ...이 궁금하다.')}</div>`}
function renderGallery(){return `<div class="hero"><h2>${tr('Gallery Walk Card','갤러리 워크 카드')}</h2>${stationSelect()}</div><div class="card"><h3>${tr('Final public card','최종 공유 카드')}</h3>${inputBlock('Gallery Walk Card','갤러리 워크 카드','galleryCard','Text / Oracle Form / Historical WHERE / Covenant Breach or Promise / Today’s Orthopraxy','본문 / 신탁 형식 / 역사적 WHERE / 언약 위반 또는 약속 / 오늘의 Orthopraxy')}</div><div class="grid two"><div class="card">${inputBlock('One question we want other groups to ask us','다른 그룹에게 받고 싶은 질문 하나','peerQuestion','What would you ask us to deepen this reading?','이 읽기를 심화하기 위해 어떤 질문을 받고 싶은가?',true)}</div><div class="card"><h3>${tr('Peer response prompts','동료 응답 질문')}</h3><ol><li>${tr('One strength','강점 하나')}</li><li>${tr('One question','질문 하나')}</li><li>${tr('One improvement','개선점 하나')}</li></ol></div></div>`}
function renderRubric(){return `<div class="hero"><h2>${tr('Rubric','평가 기준')}</h2><p class="subtitle">${tr('The score evaluates process and interpretive quality, not polished AI language.','점수는 매끄러운 AI 문장이 아니라 과정과 해석의 질을 평가합니다.')}</p></div><div class="card"><table class="table"><tr><th>${tr('Level','수준')}</th><th>${tr('Name','명칭')}</th><th>${tr('Description','설명')}</th></tr><tr><td>1</td><td>${tr('AI-copying / unsupported','AI 복사 / 근거 부족')}</td><td>${tr('No visible first answer, weak textual grounding, or final-only AI output.','첫 답변이 보이지 않고, 본문 근거가 약하며, 최종 AI 출력만 제시한다.')}</td></tr><tr><td>2</td><td>${tr('Basic observation','기초 관찰')}</td><td>${tr('Names the topic but misses prophetic genre, historical setting, or covenant logic.','주제는 말하지만 예언 장르, 역사 배경, 언약 논리가 약하다.')}</td></tr><tr><td>3</td><td>${tr('Method present','방법 사용')}</td><td>${tr('Uses Fee/Stuart or Osborne but integration remains thin.','Fee/Stuart 또는 Osborne을 사용하지만 통합이 약하다.')}</td></tr><tr><td>4</td><td>${tr('Strong integration','강한 통합')}</td><td>${tr('Integrates forth-telling, covenant enforcement, genre, context, and contemporary significance.','forth-telling, 언약 집행, 장르, 문맥, 오늘의 의미를 통합한다.')}</td></tr><tr><td>5</td><td>${tr('Formational synthesis','형성적 종합')}</td><td>${tr('Integrates Fee/Stuart + Osborne + WHERE–WHO–WHAT into embodied covenant faithfulness and orthopraxy.','Fee/Stuart + Osborne + WHERE–WHO–WHAT을 삶으로 구현되는 언약 신실함과 orthopraxy로 통합한다.')}</td></tr></table></div>`}
function renderMCQ(){let html=`<div class="hero"><h2>${tr('Check Understanding','이해 점검')}</h2><p class="subtitle">${tr('Optional quick check from the adaptive app content.','Adaptive 앱 내용을 바탕으로 한 선택적 빠른 점검입니다.')}</p></div>`; DATA.mcqs.forEach((q,i)=>{const opts=state.lang==='ko'?q.ko_opts:q.en_opts; html += `<div class="card"><h3>Q${i+1}. ${state.lang==='ko'?q.ko_q:q.en_q}</h3>${opts.map((o,j)=>`<button class="mcq-option" onclick="markMCQ(this,${j},${q.answer})">${esc(o)}</button>`).join('')}</div>`}); return html}
function markMCQ(btn,choice,answer){const parent=btn.parentElement; parent.querySelectorAll('.mcq-option').forEach(b=>b.disabled=true); btn.classList.add(choice===answer?'correct':'wrong'); if(choice!==answer) parent.querySelectorAll('.mcq-option')[answer].classList.add('correct')}
function collect(){const selected=text(); const all={timestamp:new Date().toISOString(),app:'BH Week 12 Prophets Active Learning Dual Stage',courseWeek:'BH Week 12',destinationClass:normalizeClass(get('className',true)),language:state.lang,selectedText:state.text,selectedRef:selected.ref,selectedTitleEn:selected.title_en,selectedTitleKo:selected.title_ko,group:{} ,stations:{}}; globalFields.forEach(f=>all.group[f]=get(f,true)); all.group.className=normalizeClass(all.group.className); DATA.coreTexts.forEach(x=>{all.stations[x.id]={ref:x.ref,titleEn:x.title_en,titleKo:x.title_ko,dayEn:x.day_en,dayKo:x.day_ko,exeQuestionEn:x.exe_en,exeQuestionKo:x.exe_ko,herQuestionEn:x.her_en,herQuestionKo:x.her_ko,integrationSentenceEn:x.integration_en,integrationSentenceKo:x.integration_ko}; textFields.forEach(f=>all.stations[x.id][f]=localStorage.getItem(LS+':'+x.id+':'+f)||'')}); return all}
function download(name,text,type){const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url)}
function renderExport(){const json=JSON.stringify(collect(),null,2); const last=localStorage.getItem(LS+':lastSubmit') || ''; return `<div class="hero"><h2>${tr('Submit / Export / Save','제출 / 내보내기 / 저장')}</h2><p class="subtitle">${tr('Submit the active learning work to the Google Spreadsheet, or export a local copy for backup.','능동 학습 작업을 Google Spreadsheet로 제출하거나, 백업용 로컬 사본으로 내보내세요.')}</p></div><div class="card success"><h3>${tr('Google Spreadsheet Submission','Google Spreadsheet 제출')}</h3>${classSelect()}<label>${tr('Google Apps Script Web App URL','Google Apps Script 웹 앱 URL')}</label><input value="${esc(getScriptUrl())}" placeholder="https://script.google.com/macros/s/DEPLOYMENT_ID/exec" oninput="setScriptUrl(this.value)"><p class="muted">${tr('Use the /exec Web App URL. Deploy the Apps Script as Web app and allow access for anyone with the link or your institution, depending on your Google settings.','/exec 웹 앱 URL을 사용하세요. Apps Script를 웹 앱으로 배포하고, Google 설정에 따라 링크가 있는 사용자 또는 기관 사용자에게 접근을 허용하세요.')}</p><button class="primary" onclick="submitToGoogleSheet()">${tr('Submit to Google Sheet','Google Sheet로 제출')}</button>${last?`<p class="muted">${tr('Last submitted','마지막 제출')}: ${esc(last)}</p>`:''}</div><div class="row card"><button class="primary" onclick="download('BH_Week12_Prophets_active_group_work.json', JSON.stringify(collect(),null,2),'application/json')">${tr('Download JSON','JSON 다운로드')}</button><button onclick="navigator.clipboard.writeText(JSON.stringify(collect(),null,2)).then(()=>toast(tr('Copied','복사되었습니다'))) ">${tr('Copy JSON','JSON 복사')}</button><button onclick="window.print()">${tr('Print / Save PDF','인쇄 / PDF 저장')}</button><button onclick="if(confirm(tr('Clear all saved work?','저장된 모든 작업을 지울까요?'))){Object.keys(localStorage).filter(k=>k.startsWith(LS)).forEach(k=>localStorage.removeItem(k)); location.reload()}">${tr('Reset','초기화')}</button></div><div class="card"><label>${tr('Export Preview','내보내기 미리보기')}</label><textarea style="min-height:420px" readonly>${esc(json)}</textarea></div>`}
function updateProgress(){const completeGlobal = globalFields.filter(f=>get(f,true).trim().length>1).length; const completeText = textFields.filter(f=>get(f,false).trim().length>2).length; const pct=Math.min(100, Math.round(((state.visited.size/navItems.length)*0.25 + (completeGlobal/globalFields.length)*0.2 + (completeText/textFields.length)*0.55)*100)); document.getElementById('progressText').textContent=pct+'%'; document.getElementById('progressBar').style.width=pct+'%'}
function render(){renderChrome(); let html=''; if(state.active==='welcome')html=renderWelcome(); if(state.active==='toolkit')html=renderToolkit(); if(state.active==='personal')html=renderPersonal(); if(state.active==='group')html=renderGroup(); if(state.active==='station')html=renderStation(); if(state.active==='individual')html=renderIndividual(); if(state.active==='coaching')html=renderCoaching(); if(state.active==='revision')html=renderRevision(); if(state.active==='groupwork')html=renderGroupWork(); if(state.active==='final')html=renderFinal(); if(state.active==='consensus')html=renderConsensus(); if(state.active==='gallery')html=renderGallery(); if(state.active==='rubric')html=renderRubric(); if(state.active==='export')html=renderExport(); const idx=navItems.findIndex(i=>i[0]===state.active); const safeIdx=idx<0?0:idx; const prev=navItems[Math.max(0,safeIdx-1)][0]; const next=navItems[Math.min(navItems.length-1,safeIdx+1)][0]; html += `<div class="footerNav no-print"><button onclick="go('${prev}')">← ${tr('Previous','이전')}</button><button onclick="go('${next}')">${tr('Next','다음')} →</button></div>`; document.getElementById('screen').innerHTML=html; updateProgress()}
render();
</script>
</body>
</html>
